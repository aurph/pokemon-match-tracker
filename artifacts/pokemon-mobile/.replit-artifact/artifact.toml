kind = "mobile"
previewPath = "/pokemon-mobile/"
title = "Pokémon Match Tracker Mobile"
version = "1.0.0"
id = "artifacts/pokemon-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/pokemon-mobile/" ]
localPort = 19535

[services.development]
run = "pnpm --filter @workspace/pokemon-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pokemon-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/pokemon-mobile", "run", "serve" ]

[services.env]
PORT = "19535"
BASE_PATH = "/pokemon-mobile/"
